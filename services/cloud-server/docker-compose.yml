services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commentfilter
      POSTGRES_USER: commentfilter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - comment_filter_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commentfilter -d commentfilter"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgres://commentfilter:${POSTGRES_PASSWORD}@db:5432/commentfilter
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    expose:
      - "8787"
    networks:
      default: {}
      dpanel-local:
        aliases:
          - comment-filter.pod.dpanel.local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  comment_filter_pgdata:

networks:
  dpanel-local:
    external: true
