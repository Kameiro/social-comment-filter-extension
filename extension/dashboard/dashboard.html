<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>评论数据库</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="heading">
        <h1>评论数据库</h1>
        <span id="dbStatus" class="status">本机浏览器</span>
      </div>
      <div class="toolbar-actions">
        <div class="account-actions">
          <div id="cloudAccountStatus" class="account-status" aria-live="polite">
            <span class="account-status-label">账户</span>
            <strong id="cloudAccountStatusText">未登录</strong>
          </div>
          <button id="cloudAccountButton" class="button account-button" type="button">登录 / 注册</button>
        </div>
        <div class="data-actions">
          <div class="sync-summary" aria-live="polite">
            <span class="sync-summary-dot"></span>
            <div>
              <span class="sync-summary-label">自动同步</span>
              <strong id="cloudSyncStatusText">登录后自动同步</strong>
            </div>
            <time id="cloudSyncLastTime" datetime="">尚未同步</time>
          </div>
        </div>
      </div>
    </header>

    <section class="summary" aria-label="数据库统计">
      <div><strong id="postCount">0</strong><span>帖子</span></div>
      <div><strong id="commentCount">0</strong><span>评论</span></div>
      <div><strong id="userCount">0</strong><span>用户</span></div>
      <p id="notice" role="status" aria-live="polite"></p>
    </section>

    <section class="controls" aria-label="筛选数据库">
      <div class="tabs" role="tablist" aria-label="数据类型">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-view="posts">帖子</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-view="comments">评论</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-view="users">用户</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-view="discover">发现帖子</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-view="analysis">用户分析</button>
      </div>
      <label class="search-wrap">
        <span class="sr-only">搜索当前数据</span>
        <input id="search" type="search" placeholder="搜索帖子、评论或用户">
      </label>
      <label id="postFilterWrap" class="post-filter" hidden>
        <span class="sr-only">按帖子筛选</span>
        <select id="postFilter"><option value="">全部帖子</option></select>
      </label>
      <label id="taskFilterWrap" class="post-filter" hidden>
        <span class="sr-only">按任务筛选</span>
        <select id="taskFilter"><option value="">全部任务</option></select>
      </label>
      <button id="refresh" class="button secondary" type="button">刷新</button>
      <button id="copyView" class="button secondary" type="button">复制当前列表</button>
    </section>

    <section id="content" class="content" aria-live="polite"></section>
  </main>

  <div id="messageModal" class="modal-backdrop" hidden>
    <section class="message-modal" role="dialog" aria-modal="true" aria-labelledby="messageModalTitle">
      <div class="message-modal-header">
        <div>
          <h2 id="messageModalTitle">发送私信</h2>
          <p id="messageModalMeta" class="subtle"></p>
        </div>
        <button id="closeMessageModal" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <label class="message-label">
        私信内容
        <textarea id="messageContent" rows="7" maxlength="500" placeholder="输入要发送的内容"></textarea>
      </label>
      <p id="messageContext" class="message-context"></p>
      <div class="message-modal-actions">
        <button id="cancelMessage" class="button quiet" type="button">取消</button>
        <button id="sendMessage" class="button primary" type="button">发送私信</button>
      </div>
    </section>
  </div>
  <div id="cloudLoginModal" class="modal-backdrop" hidden>
    <section class="message-modal cloud-login-modal" role="dialog" aria-modal="true" aria-labelledby="cloudLoginTitle">
      <div class="message-modal-header">
        <div>
          <h2 id="cloudLoginTitle">账户登录</h2>
          <p class="subtle">登录后，评论数据库会显示当前账户状态，扫描数据会自动保存到你的账户。</p>
        </div>
        <button id="closeCloudLoginModal" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <div class="account-tabs" role="tablist" aria-label="账户操作">
        <button class="account-tab active" type="button" role="tab" aria-selected="true" data-account-mode="password">密码登录</button>
        <button class="account-tab" type="button" role="tab" aria-selected="false" data-account-mode="code">验证码登录</button>
        <button class="account-tab" type="button" role="tab" aria-selected="false" data-account-mode="register">注册账户</button>
      </div>
      <form id="cloudLoginForm">
        <label class="message-label">
          邮箱
          <input id="cloudLoginEmail" type="email" autocomplete="username" required>
        </label>
        <label id="accountCodeWrap" class="message-label" hidden>
          邮箱验证码
          <span class="code-input-row"><input id="accountCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button id="sendAccountCode" class="button secondary" type="button">获取验证码</button></span>
        </label>
        <label id="accountPasswordWrap" class="message-label">
          密码
          <input id="cloudLoginPassword" type="password" autocomplete="current-password" minlength="12">
          <span id="accountPasswordHint" class="field-hint">密码至少需要 12 个字符。</span>
        </label>
        <p id="cloudLoginNotice" class="message-context" role="status" aria-live="polite"></p>
        <div class="message-modal-actions">
          <button id="cloudLogoutButton" class="button quiet" type="button" hidden>退出登录</button>
          <span class="action-spacer"></span>
          <button id="cancelCloudLogin" class="button quiet" type="button">取消</button>
          <button id="submitCloudLogin" class="button primary" type="submit">登录</button>
        </div>
      </form>
    </section>
  </div>
  <script src="../cloud/cloud_sync.js"></script>
  <script src="../content/common/post_utils.js"></script>
  <script src="../data/comment_database.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
